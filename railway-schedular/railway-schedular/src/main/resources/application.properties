spring.application.name=railway-schedular
spring.datasource.url=jdbc:postgresql://localhost:5432/report_db
spring.datasource.username=postgres
spring.datasource.password=Grahit@123
spring.datasource.driver-class-name=org.postgresql.Driver

# Since we're using Flyway, disable Hibernate's auto schema generation
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration